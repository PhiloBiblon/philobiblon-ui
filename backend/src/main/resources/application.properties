logging.level.io.github.philobiblon=INFO

allowed.origins=${ALLOWED_ORIGINS}

oauth.consumerKey=${OAUTH_CONSUMER_KEY}
oauth.consumerSecret=${OAUTH_CONSUMER_SECRET}
oauth.callbackUrl=${OAUTH_CALLBACK_URL}

wikibase.baseUrl=${WIKIBASE_BASE_URL}
wikibase.apiUrl=${WIKIBASE_API_URL}
wikibase.indexUrl=${WIKIBASE_INDEX_URL}
wikibase.niceUrlBase=${WIKIBASE_NICE_URL_BASE}

sparql.baseUrl=${SPARQL_BASE_URL}
sparql.endpoint=${SPARQL_ENDPOINT}
sparql.queryPrefix=${SPARQL_QUERY_PREFIX}

# Local materialized index for the general (autocomplete) search
spring.datasource.url=jdbc:h2:file:${SEARCH_DB_PATH:./data/searchcache}
# Same path as above, exposed as its own property so the file size can be read directly
# (without parsing it back out of the JDBC URL) for the cache-status/refresh observability.
search.cache.dbFilePath=${SEARCH_DB_PATH:./data/searchcache}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
search.index.refreshCron=${SEARCH_INDEX_REFRESH_CRON:0 0 3 * * *}
search.index.retry.maxAttempts=${SEARCH_INDEX_RETRY_MAX_ATTEMPTS:5}
search.index.retry.initialBackoffMs=${SEARCH_INDEX_RETRY_INITIAL_BACKOFF_MS:10000}
search.index.retry.backoffMultiplier=${SEARCH_INDEX_RETRY_BACKOFF_MULTIPLIER:4}

# DB-backed SPARQL result cache serving /api/search
search.cache.evictAfterDays=${SEARCH_CACHE_EVICT_AFTER_DAYS:30}
search.cache.candidateLimit=${SEARCH_CACHE_CANDIDATE_LIMIT:1000}
search.cache.maxResultLimit=${SEARCH_CACHE_MAX_RESULT_LIMIT:300}
search.cache.loadConcurrency=${SEARCH_CACHE_LOAD_CONCURRENCY:2}
# Change-driven nightly refresh: FactGrid's RecentChanges decide which cached queries are reloaded.
# Every registered query is reloaded anyway after this many days (bounds staleness, also covers
# dependencies change detection cannot see).
search.cache.refresh.fullEveryDays=${SEARCH_CACHE_REFRESH_FULL_EVERY_DAYS:7}
# More distinct changed items than this in one window triggers a full refresh instead.
search.cache.refresh.maxChangedItems=${SEARCH_CACHE_REFRESH_MAX_CHANGED_ITEMS:30000}
# The change window starts this long before the last successful poll, to tolerate feed lag.
search.cache.refresh.overlapMinutes=${SEARCH_CACHE_REFRESH_OVERLAP_MINUTES:60}
wikibase.itemNamespace=${WIKIBASE_ITEM_NAMESPACE:120}
